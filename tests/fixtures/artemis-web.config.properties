# node服务
server.host = localhost
#server.port = 6100
server.port = 9017
server.pathname = /artemis-web

# 接口地址
java.pathname = /artemis
java.origin = http://127.0.0.1:9016

log.path = ../../../logs/artemis-web

# service配置
#service.name = %SERVICE_NAME%
service.name = artemis-web

# 连接超时单位秒
connection.waittime = 300
platform = iSecure
