location ^~ /artemis {
    if ($scheme = "http") {
        break;
    }
    if ($artemis = "local") {
        proxy_pass http://http_artemis;
    }
    if ($artemis = "remote") {
        proxy_pass https://https_artemis_remote;
    }
    autoindex off;
}

location ^~ /artemis-web {
    if ($scheme = "http") {
        break;
    }
    if ($artemis = "local") {
        proxy_pass http://http_artemis_web;
    }
    if ($artemis = "remote") {
        proxy_pass https://https_artemis_remote;
    }
    autoindex off;
}
